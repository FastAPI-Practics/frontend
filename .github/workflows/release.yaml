name: Release workflow
on:
  push:
    branches:
      - main
      - ci-cd-2

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Run semantic
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: ./app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    outputs:
      new_release: ${{ steps.semantic_release.outputs.new_release_version }}
  deploy:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Setup ansible
        run: pipx install --include-deps ansible
      - name: Install ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Setup SSH
        shell: bash
        run: |
          eval `ssh-agent -s`
          mkdir -p ~/.ssh/
          touch ~/.ssh/id_ed25519
          echo -e "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 700 ~/.ssh/id_ed25519
          echo -r  "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Create inventory
        run: |
          cat > ansible/inventory.ini << EOF
          [vms]
          ${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }}
          EOF
      - name: Run test playbook
        run: |
          cd ansible
          ansible-playbook \
            -i inventory.ini \
            playbooks/test-playbook.yaml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_FORCE_COLOR: "true"

